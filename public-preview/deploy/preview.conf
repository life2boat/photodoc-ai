# PhotoDoc AI — public information preview.
#
# Serves ONLY the approved informational pages and one stylesheet, with GET/HEAD only.
# There is no proxy_pass anywhere: the backend cannot be reached through this server,
# so /api/*, payment creation, the Robokassa callback, /api/health and /order-status are
# unreachable by construction. No SPA fallback: unknown paths return 404.
#
# Install as /etc/nginx/sites-available/photodoc-preview and enable it INSTEAD of the
# current maintenance site. Requires the existing certificate; DNS/TLS are not modified.

server {
    listen 80;
    listen [::]:80;
    server_name photo1storage.ru www.photo1storage.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name photo1storage.ru www.photo1storage.ru;

    ssl_certificate     /etc/letsencrypt/live/photo1storage.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photo1storage.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    root /srv/photodoc/public-preview;
    autoindex off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # --- approved pages: exact match, GET/HEAD only -------------------------------
    location = / {
        limit_except GET { deny all; }
        try_files /index.html =404;
    }

    location = /services {
        limit_except GET { deny all; }
        try_files /services.html =404;
    }

    location = /contacts {
        limit_except GET { deny all; }
        try_files /contacts.html =404;
    }

    location = /offer {
        limit_except GET { deny all; }
        try_files /offer.html =404;
    }

    location = /privacy {
        limit_except GET { deny all; }
        try_files /privacy.html =404;
    }

    location = /refund {
        limit_except GET { deny all; }
        try_files /refund.html =404;
    }

    # --- the only static asset ---------------------------------------------------
    location = /assets/styles.css {
        limit_except GET { deny all; }
        try_files /assets/styles.css =404;
    }

    # --- everything else is closed ----------------------------------------------
    # Exact matches above win, so no other path can reach a file. No try_files fallback:
    # /order-status, /api/*, arbitrary names and directory paths all end here.
    location / {
        return 404;
    }
}
