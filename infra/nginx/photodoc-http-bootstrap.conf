# PhotoDoc AI — ACME Bootstrap HTTP Configuration (Phase 1)
# Used on initial Web VPS deployment BEFORE Let's Encrypt certificates are issued.
#
# Usage:
#   1. Copy this file to /etc/nginx/sites-available/photodoc.conf
#   2. ln -sf /etc/nginx/sites-available/photodoc.conf /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#   4. Run Certbot:
#      certbot certonly --webroot -w /var/www/certbot -d photodoc-ai.ru -d www.photodoc-ai.ru
#   5. Once certificates exist, switch to photodoc-https.conf (Phase 2).

server {
    listen 80;
    listen [::]:80;
    server_name photodoc-ai.ru www.photodoc-ai.ru;

    # ACME challenge directory for Let's Encrypt HTTP-01 validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Initial placeholder response while TLS certificate is being requested
    location / {
        default_type text/plain;
        return 200 "PhotoDoc AI — HTTPS Bootstrap in progress. Awaiting ACME challenge completion.\n";
    }
}
