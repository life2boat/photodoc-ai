# PhotoDoc AI — Production HTTPS Reverse Proxy Configuration
# Target: Dedicated Web VPS or Host-level Nginx

# Rate limiting zone for API requests
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Upstream to local PhotoDoc frontend container
upstream photodoc_upstream {
    server 127.0.0.1:8080;
    keepalive 32;
}

# 1. HTTP Server — ACME Challenge & Permanent Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name photodoc-ai.ru www.photodoc-ai.ru;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server — TLS Termination & Application Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name photodoc-ai.ru www.photodoc-ai.ru;

    # TLS Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/photodoc-ai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photodoc-ai.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/photodoc-ai.ru/chain.pem;

    # Modern TLS Security Baseline (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload Limit Alignment (Reconciled with P1: 80 MiB payload + multipart overhead)
    client_max_body_size 100M;
    client_body_buffer_size 1M;

    # Proxy Timeouts for Large Uploads
    proxy_connect_timeout 60s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Static Assets & SPA Handled by Photodoc Container
    location / {
        proxy_pass http://photodoc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # API Route — with rate limiting and unbuffered streaming for uploads
    location /api/ {
        proxy_pass http://photodoc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Disable disk buffering for fast multi-megabyte photo streaming
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Robokassa Webhook Callback — bypass rate limits to avoid dropped payment notifications
    location = /api/payment/robokassa/result {
        proxy_pass http://photodoc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
