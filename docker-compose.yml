services:
  backend:
    build:
      context: ./backend
    container_name: photodoc-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # backend/.env should contain:
    # ROBOKASSA_MERCHANT_LOGIN, ROBOKASSA_PASSWORD1, ROBOKASSA_PASSWORD2,
    # ROBOKASSA_IS_TEST, SMTP_SERVER, SMTP_PORT, SMTP_USER, SMTP_PASSWORD,
    # EMAIL_TO, YANDEX_DISK_TOKEN
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: photodoc-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
