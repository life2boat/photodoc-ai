services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_PATH=${DATABASE_PATH:-/data/orders.db}
      - ROBOKASSA_MERCHANT_LOGIN=${ROBOKASSA_MERCHANT_LOGIN:-}
      - ROBOKASSA_PASSWORD1=${ROBOKASSA_PASSWORD1:-}
      - ROBOKASSA_PASSWORD2=${ROBOKASSA_PASSWORD2:-}
      - ROBOKASSA_IS_TEST=${ROBOKASSA_IS_TEST:-1}
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_TO=${EMAIL_TO:-}
      - YANDEX_DISK_TOKEN=${YANDEX_DISK_TOKEN:-}
    volumes:
      - photodoc_db:/data
      - photodoc_uploads:/app/uploads
    networks:
      - photodoc_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_YANDEX_METRIKA_ID=${VITE_YANDEX_METRIKA_ID:-}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
        - VITE_API_URL=${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - photodoc_network

volumes:
  photodoc_db:
    name: photodoc_db
  photodoc_uploads:
    name: photodoc_uploads

networks:
  photodoc_network:
    name: photodoc_network
