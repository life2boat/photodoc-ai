services:
  backend:
    build:
      context: ./backend
    container_name: photodoc-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      ORDERS_DB_PATH: /app/data/orders.db
    volumes:
      - backend-data:/app/data
      - ./backend/uploads:/app/uploads
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: photodoc-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  backend-data:
