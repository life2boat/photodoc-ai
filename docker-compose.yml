services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_PATH=${DATABASE_PATH:-/data/orders.db}
    volumes:
      - photodoc_db:/data
      - ${PHOTODOC_UPLOADS_SOURCE:-photodoc_uploads}:/app/uploads
    networks:
      - photodoc_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_YANDEX_METRIKA_ID=${VITE_YANDEX_METRIKA_ID:-}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
        - VITE_API_URL=${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - photodoc_network

volumes:
  photodoc_db:
    name: ${PHOTODOC_DB_VOLUME:-photodoc_db}
  photodoc_uploads:
    name: photodoc_uploads

networks:
  photodoc_network:
    name: photodoc_network
