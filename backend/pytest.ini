[pytest]
# The PR-A A1 host receipt-writer tests import the host-side package ``ops.receipts``,
# which lives at the repository root rather than inside ``backend/``. CI runs
# ``pytest tests`` with ``working-directory: backend``, where pytest's default import-mode
# rootdir insertion (``backend/tests``) cannot see the repository root, so collection
# aborts with ``ModuleNotFoundError: No module named 'ops'``.
#
# ``pythonpath`` is pytest's own declarative mechanism for adding import roots; entries
# are resolved relative to the rootdir (this file's directory) and prepended in order.
# ``.`` (this backend directory) is listed first so the application's own ``main.py``
# keeps precedence over the unrelated repository-root ``main.py`` helper; ``..`` (the
# repository root) makes ``ops.receipts`` importable. No runtime import manipulation and
# no change to package layout.
pythonpath = . ..
