name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  playwright-tests:
    name: Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: example-anon-key
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Run lint
      run: npm run lint
    - name: Run build
      run: npm run build
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30

  payment-security-tests:
    name: Payment Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ROBOKASSA_MERCHANT_LOGIN: ci_merchant
      ROBOKASSA_PASSWORD1: ci_pass1
      ROBOKASSA_PASSWORD2: ci_pass2
      ROBOKASSA_IS_TEST: "1"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install backend dependencies
      run: pip install -r requirements.txt
    - name: Install pytest
      run: pip install pytest
    - name: Run payment security tests
      run: pytest tests/test_payment_security.py -v
    - name: Run migration reconciliation tests
      run: pytest tests/test_migration_reconciliation.py -v
    - name: Run rollback bundle tests
      run: pytest tests/test_rollback_bundle.py -v
    - name: Verify preflight script
      run: |
        python ../scripts/production_preflight.py --db nonexistent.db || true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: example-anon-key
      VITE_YANDEX_METRIKA_ID: ""
      VITE_API_URL: /api
      PORT: 8080
      ROBOKASSA_IS_TEST: "1"
      DATABASE_PATH: /data/orders.db
    steps:
    - uses: actions/checkout@v4
    - name: Validate generic Docker Compose config
      run: docker compose config
    - name: Verify synthetic production env file loading and non-override
      run: |
        cat << 'EOF' > backend/.env
        ROBOKASSA_MERCHANT_LOGIN=ci
        ROBOKASSA_PASSWORD1=ci1
        ROBOKASSA_PASSWORD2=ci2
        ROBOKASSA_IS_TEST=1
        SMTP_SERVER=example.invalid
        SMTP_PORT=465
        SMTP_USER=ci
        SMTP_PASSWORD=ci
        EMAIL_TO=ci@example.invalid
        YANDEX_DISK_TOKEN=ci
        EOF

        # Run preflight env verification check
        python scripts/production_preflight.py --check-env backend/.env

        # Run compose config on base + production overlay
        PROD_CONFIG=$(docker compose -f docker-compose.yml -f docker-compose.production.yml config)
        echo "${PROD_CONFIG}" | grep -q "photodoc_backend-data"
        echo "${PROD_CONFIG}" | grep -q "/opt/photodoc/backend/uploads"

        # Check that synthetic values are loaded from env_file
        echo "${PROD_CONFIG}" | grep -q "ROBOKASSA_MERCHANT_LOGIN: ci"
        echo "${PROD_CONFIG}" | grep -q "ROBOKASSA_PASSWORD1: ci1"
        echo "${PROD_CONFIG}" | grep -q "ROBOKASSA_PASSWORD2: ci2"
        echo "${PROD_CONFIG}" | grep -q "SMTP_SERVER: example.invalid"
        echo "PRODUCTION_ENV_FILE_LOADED=true"

        # Verify that generic base environment does NOT override values with empty strings
        if echo "${PROD_CONFIG}" | grep -q 'ROBOKASSA_MERCHANT_LOGIN: ""'; then
          echo "FAIL: generic base environment overrode ROBOKASSA_MERCHANT_LOGIN with empty string!"
          exit 1
        fi
        echo "EMPTY_SECRET_OVERRIDE=false"

        # Clean up synthetic env file
        rm -f backend/.env
    - name: Verify app-image-independent migration runner
      run: |
        set -eu
        DB_VOLUME="photodoc-candidate-migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        cleanup() {
          docker volume rm "${DB_VOLUME}" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        for app_image in $(docker compose config --images); do
          if docker image inspect "${app_image}" >/dev/null 2>&1; then
            echo "FAIL: PhotoDoc application image exists before migration regression"
            exit 1
          fi
        done
        docker volume create "${DB_VOLUME}" >/dev/null
        docker run --rm --user 0 \
          -v "${DB_VOLUME}:/data" \
          python:3.11-alpine \
          python -c "import sqlite3; c=sqlite3.connect('/data/orders.db'); c.execute('CREATE TABLE orders (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, phone TEXT)'); c.execute(\"INSERT INTO orders (name, phone) VALUES ('synthetic', '+70000000000')\"); c.commit(); c.close()"
        docker run --rm --user 0 \
          -v "${DB_VOLUME}:/data" \
          alpine sh -c 'chown 0:0 /data/orders.db && chmod 0644 /data/orders.db && test "$(stat -c "%u:%g %a" /data/orders.db)" = "0:0 644"'

        DRY_RUN_OUTPUT="$(docker run --rm --user 65534:65534 \
          -v "${DB_VOLUME}:/data:ro" \
          -v "$PWD/backend:/candidate/backend:ro" \
          -w /candidate/backend \
          python:3.11-alpine \
          python migrations/reconcile_payment_schema.py \
            --db /data/orders.db \
            --check \
            --allow-legacy-unmarked)"
        printf '%s\n' "${DRY_RUN_OUTPUT}"
        printf '%s\n' "${DRY_RUN_OUTPUT}" | grep -q '^MIGRATION_REQUIRED=true$'

        docker run --rm --user 0 \
          -v "${DB_VOLUME}:/data" \
          -v "$PWD/backend:/candidate/backend:ro" \
          -w /candidate/backend \
          python:3.11-alpine \
          python migrations/reconcile_payment_schema.py \
            --db /data/orders.db \
            --apply \
            --allow-legacy-unmarked
        echo "MIGRATION_RUNNER_APP_IMAGE_INDEPENDENT=true"
        echo "ROOT_MIGRATION_ON_ROOT_OWNED_DB=PASS"

        PREFLIGHT_OUTPUT="$(docker run --rm --user 65534:65534 \
          -v "${DB_VOLUME}:/data:ro" \
          -v "$PWD/scripts:/candidate/scripts:ro" \
          -v "$PWD/backend:/candidate/backend:ro" \
          -w /candidate \
          python:3.11-alpine \
          python scripts/production_preflight.py \
            --db /data/orders.db \
            --check-only)"
        printf '%s\n' "${PREFLIGHT_OUTPUT}"
        printf '%s\n' "${PREFLIGHT_OUTPUT}" | grep -q '^DB_APPLICATION_ID=1346650441$'
        printf '%s\n' "${PREFLIGHT_OUTPUT}" | grep -q '^DB_IDENTITY_VALID=true$'
        printf '%s\n' "${PREFLIGHT_OUTPUT}" | grep -q '^READY_FOR_STARTUP=true$'
        echo "STRICT_READINESS_AFTER_MIGRATION=PASS"
    - name: Build Docker images
      run: docker compose build
    - name: Prove production external-volume and DB identity fail-closed contracts
      run: |
        set -eu
        PROJECT="p0-volume-ci-${GITHUB_RUN_ID}"
        MISSING="photodoc-missing-${GITHUB_RUN_ID}"
        WRONG="photodoc-wrong-${GITHUB_RUN_ID}"
        CORRECT="photodoc-correct-${GITHUB_RUN_ID}"
        UPLOADS="$PWD/.ci-uploads"
        mkdir -p "${UPLOADS}"
        cat << 'EOF' > backend/.env
        ROBOKASSA_MERCHANT_LOGIN=ci
        ROBOKASSA_PASSWORD1=ci1
        ROBOKASSA_PASSWORD2=ci2
        ROBOKASSA_IS_TEST=1
        SMTP_SERVER=example.invalid
        SMTP_PORT=465
        SMTP_USER=ci
        SMTP_PASSWORD=ci
        EMAIL_TO=ci@example.invalid
        YANDEX_DISK_TOKEN=ci
        EOF
        cleanup() {
          docker compose -p "${PROJECT}" -f docker-compose.yml -f docker-compose.production.yml down --remove-orphans >/dev/null 2>&1 || true
          docker volume rm "${WRONG}" "${CORRECT}" >/dev/null 2>&1 || true
          rm -f backend/.env
          rm -rf "${UPLOADS}"
        }
        trap cleanup EXIT

        if PHOTODOC_DB_VOLUME="${MISSING}" PHOTODOC_UPLOADS_SOURCE="${UPLOADS}" \
          docker compose -p "${PROJECT}" -f docker-compose.yml -f docker-compose.production.yml create backend; then
          echo "FAIL: missing external production volume was silently created"
          exit 1
        fi
        if docker volume inspect "${MISSING}" >/dev/null 2>&1; then
          echo "FAIL: Docker created the missing external production volume"
          exit 1
        fi
        echo "MISSING_EXTERNAL_VOLUME_FAILS=true"

        docker volume create "${WRONG}" >/dev/null
        docker volume create "${CORRECT}" >/dev/null
        # The failed `create` still builds the project-scoped backend image before
        # Compose checks the missing external volume. No container exists yet, so
        # `docker compose images -q` would be empty; use the deterministic tag.
        BACKEND_IMAGE="${PROJECT}-backend"

        docker run --rm --user root -e DATABASE_PATH=/data/orders.db \
          -v "${WRONG}:/data" "${BACKEND_IMAGE}" \
          python -c "import main, sqlite3; c=sqlite3.connect('/data/orders.db'); c.execute('PRAGMA application_id=123456'); c.commit(); c.close()"
        if PHOTODOC_DB_VOLUME="${WRONG}" PHOTODOC_UPLOADS_SOURCE="${UPLOADS}" \
          docker compose -p "${PROJECT}" -f docker-compose.yml -f docker-compose.production.yml \
          run --rm --no-deps backend python -c "import main"; then
          echo "FAIL: backend accepted the wrong database identity"
          exit 1
        fi
        echo "WRONG_DB_IDENTITY_FAILS=true"

        docker run --rm --user root -e DATABASE_PATH=/data/orders.db \
          -v "${CORRECT}:/data" "${BACKEND_IMAGE}" python -c "import main"
        PHOTODOC_DB_VOLUME="${CORRECT}" PHOTODOC_UPLOADS_SOURCE="${UPLOADS}" \
          docker compose -p "${PROJECT}" -f docker-compose.yml -f docker-compose.production.yml \
          run --rm --no-deps backend python -c "import main; assert main.database_readiness_ok()"
        echo "CORRECT_DB_IDENTITY_PASSES=true"
    - name: Verify production-like root migration and storage permission cutover
      run: |
        set -eu
        DB_VOLUME="photodoc-root-owned-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        UPLOADS="$PWD/.ci-root-owned-uploads"
        export PHOTODOC_DB_VOLUME="${DB_VOLUME}"
        export PHOTODOC_UPLOADS_SOURCE="${UPLOADS}"
        COMPOSE="docker compose -f docker-compose.yml -f docker-compose.production.yml"

        mkdir -p "${UPLOADS}"
        cat << 'EOF' > backend/.env
        ROBOKASSA_MERCHANT_LOGIN=ci
        ROBOKASSA_PASSWORD1=ci_pass1
        ROBOKASSA_PASSWORD2=ci_pass2
        ROBOKASSA_IS_TEST=1
        SMTP_SERVER=example.invalid
        SMTP_PORT=465
        SMTP_USER=ci@example.invalid
        SMTP_PASSWORD=ci_password
        EMAIL_TO=ci@example.invalid
        YANDEX_DISK_TOKEN=ci_token
        EOF
        cleanup() {
          ${COMPOSE} down --remove-orphans >/dev/null 2>&1 || true
          docker volume rm "${DB_VOLUME}" >/dev/null 2>&1 || true
          rm -f backend/.env
          rm -rf "${UPLOADS}"
        }
        trap cleanup EXIT

        docker volume create "${DB_VOLUME}" >/dev/null
        ${COMPOSE} run --rm --no-deps --user root backend python -c \
          "import sqlite3; c=sqlite3.connect('/data/orders.db'); c.execute('CREATE TABLE orders (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, phone TEXT)'); c.execute(\"INSERT INTO orders (name, phone) VALUES ('synthetic', '+70000000000')\"); c.commit(); c.close()"
        docker run --rm --user root -v "${DB_VOLUME}:/data" -v "${UPLOADS}:/uploads" alpine sh -c '
          chown 0:0 /data /data/orders.db /uploads &&
          chmod 0755 /data /uploads &&
          chmod 0644 /data/orders.db &&
          test "$(stat -c "%u:%g %a" /data/orders.db)" = "0:0 644" &&
          test "$(stat -c "%u:%g %a" /uploads)" = "0:0 755"
        '
        echo "CURRENT_DB_OWNER=root"
        echo "BACKEND_UID=1000"

        if ${COMPOSE} run --rm --no-deps backend test -w /data/orders.db; then
          echo "FAIL: appuser could write the root-owned database before preparation"
          exit 1
        fi
        echo "APPUSER_DB_WRITE_BEFORE=false"
        if ${COMPOSE} run --rm --no-deps backend test -w /app/uploads; then
          echo "FAIL: appuser could write the root-owned uploads directory before preparation"
          exit 1
        fi
        echo "APPUSER_UPLOAD_WRITE_BEFORE=false"

        docker run --rm --user 0 \
          -v "${DB_VOLUME}:/data" \
          -v "$PWD/backend:/candidate/backend:ro" \
          -w /candidate/backend \
          python:3.11-alpine \
          python migrations/reconcile_payment_schema.py \
            --db /data/orders.db \
            --apply \
            --allow-legacy-unmarked
        echo "MIGRATION_RUNNER_APP_IMAGE_INDEPENDENT=true"
        echo "PRODUCTION_MIGRATION_CAN_WRITE_ROOT_OWNED_DB=true"
        echo "ROOT_MIGRATION_ON_ROOT_OWNED_DB=PASS"

        docker run --rm --user 65534:65534 \
          -v "${DB_VOLUME}:/data:ro" \
          -v "$PWD/scripts:/candidate/scripts:ro" \
          -v "$PWD/backend:/candidate/backend:ro" \
          -w /candidate \
          python:3.11-alpine \
          python scripts/production_preflight.py \
            --db /data/orders.db \
            --check-only
        echo "STRICT_READINESS_AFTER_MIGRATION=PASS"

        ${COMPOSE} run --rm --no-deps --user root backend sh -c '
          chown -R 1000:1000 /data /app/uploads &&
          test -w /data/orders.db &&
          test -w /app/uploads
        '

        ${COMPOSE} run --rm --no-deps backend python -c \
          "import sqlite3; c=sqlite3.connect('/data/orders.db'); c.execute('BEGIN IMMEDIATE'); c.rollback(); c.close()"
        echo "APPUSER_DB_WRITE_AFTER=true"
        echo "DB_APPUSER_WRITABLE=true"
        ${COMPOSE} run --rm --no-deps backend sh -c '
          test -w /app/uploads &&
          touch /app/uploads/.appuser-write-test &&
          rm /app/uploads/.appuser-write-test
        '
        echo "APPUSER_UPLOAD_WRITE_AFTER=true"
        echo "UPLOADS_APPUSER_WRITABLE=true"

        ${COMPOSE} run --rm --no-deps backend \
          python -c "import main; assert main.database_readiness_ok()"
        echo "STRICT_READINESS_AFTER_PREP=PASS"

        ${COMPOSE} up -d --no-deps --wait --wait-timeout 120 backend
        ${COMPOSE} exec -T backend curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null
        echo "BACKEND_SYNTHETIC_STORAGE_START=PASS"

        docker run --rm -v "${DB_VOLUME}:/data" --user root alpine sh -c '
          test -r /data/orders.db &&
          test -w /data/orders.db &&
          touch /data/.root-write-test &&
          rm /data/.root-write-test
        '
        echo "OLD_ROOT_BACKEND_CAN_ACCESS_UID1000_DB=true"
    - name: Start containers
      run: |
        docker compose up -d --wait --wait-timeout 180
        docker compose ps
    - name: Verify named volume writability and DB creation
      run: |
        echo "Verifying backend permissions on /data and /app/uploads..."
        docker compose exec -T backend sh -c '
          test -w /data &&
          test -w /app/uploads &&
          touch /data/.write-test &&
          touch /app/uploads/.write-test &&
          rm /data/.write-test /app/uploads/.write-test
        '
        echo "Verifying application database file exists in volume..."
        docker compose exec -T backend test -f /data/orders.db
        echo "Volumes are writable and orders.db exists."
    - name: Run container smoke tests
      run: |
        echo "Testing Root SPA..."
        curl --fail -s -o /dev/null -w "Root status: %{http_code}\n" "http://127.0.0.1:${PORT}/"
        curl --fail "http://127.0.0.1:${PORT}/" > /dev/null

        echo "Testing OG Image..."
        curl --fail -s -o /dev/null -w "OG image status: %{http_code}\n" "http://127.0.0.1:${PORT}/og/photodoc-og.jpg"
        curl --fail "http://127.0.0.1:${PORT}/og/photodoc-og.jpg" > /dev/null

        echo "Testing API Proxy /api/health..."
        HEALTH_RESP=$(curl --fail -sS "http://127.0.0.1:${PORT}/api/health")
        echo "API Health Response: ${HEALTH_RESP}"
        echo "${HEALTH_RESP}" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'
    - name: Dump logs on failure
      if: failure()
      run: |
        docker compose ps
        docker compose logs --no-color
    - name: Teardown containers
      if: always()
      run: docker compose down -v
