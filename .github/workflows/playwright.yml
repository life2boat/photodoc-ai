name: CI

on:
  push:
    branches: [ main, master, fix/p1-order-delivery-hardening, feat/p1-auto-photo-cleanup, infra/r4-prebuilt-staging-images, infra/r4-safe-staging-bootstrap, audit/r4-integrated-privacy-retention, fix/r4-backup-privacy-audit, fix/r4-archive-audit-hardening, fix/r4-audit-boundary-hardening ]
  pull_request:
    branches: [ main, master, fix/p0-production-readiness, infra/r2-public-https-preflight, feat/p1-auto-photo-cleanup, infra/r4-prebuilt-staging-images, infra/r4-safe-staging-bootstrap, audit/r4-integrated-privacy-retention, fix/r4-backup-privacy-audit, fix/r4-archive-audit-hardening, fix/r4-audit-boundary-hardening ]
  workflow_dispatch:

jobs:
  playwright-tests:
    name: Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: example-anon-key
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Run lint
      run: npm run lint
    - name: Run build
      run: npm run build
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30

  payment-security-tests:
    name: Payment Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ROBOKASSA_MERCHANT_LOGIN: ci_merchant
      ROBOKASSA_PASSWORD1: ci_pass1
      ROBOKASSA_PASSWORD2: ci_pass2
      ROBOKASSA_IS_TEST: "1"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install backend dependencies
      run: pip install -r requirements.txt
    - name: Install pytest and pyyaml
      run: pip install pytest pyyaml
    - name: Run backend security, migration, and delivery tests
      run: pytest tests -v
    - name: Verify preflight scripts
      run: |
        python ../scripts/production_preflight.py --db nonexistent.db || true
        python ../scripts/verify_staging_delivery_preflight.py

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: example-anon-key
      VITE_YANDEX_METRIKA_ID: ""
      VITE_API_URL: /api
      PORT: 8080
      ROBOKASSA_IS_TEST: "1"
      DATABASE_PATH: /data/orders.db
    steps:
    - uses: actions/checkout@v4
    - name: Validate generic Docker Compose config
      run: docker compose config
    - name: Verify synthetic production env file loading and non-override
      run: |
        cat << 'EOF' > backend/.env
        ROBOKASSA_MERCHANT_LOGIN=ci
        ROBOKASSA_PASSWORD1=ci1
        ROBOKASSA_PASSWORD2=ci2
        ROBOKASSA_IS_TEST=1
        SMTP_SERVER=example.invalid
        SMTP_PORT=465
        SMTP_USER=ci
        SMTP_PASSWORD=ci
        EMAIL_TO=ci@example.invalid
        YANDEX_DISK_TOKEN=ci
        EOF

        # Run preflight env verification check
        python scripts/production_preflight.py --check-env backend/.env

        # Run compose config on base + production overlay
        PROD_CONFIG=$(docker compose -f docker-compose.yml -f docker-compose.production.yml config)
        echo "${PROD_CONFIG}" | grep -q "photodoc_backend-data"
        echo "${PROD_CONFIG}" | grep -q "/opt/photodoc/backend/uploads"

        # Check that synthetic values are loaded from env_file
        echo "${PROD_CONFIG}" | grep -q "ROBOKASSA_MERCHANT_LOGIN: ci"
        echo "${PROD_CONFIG}" | grep -q "ROBOKASSA_PASSWORD1: ci1"
        echo "${PROD_CONFIG}" | grep -q "ROBOKASSA_PASSWORD2: ci2"
        echo "${PROD_CONFIG}" | grep -q "SMTP_SERVER: example.invalid"
        echo "PRODUCTION_ENV_FILE_LOADED=true"

        # Verify that generic base environment does NOT override values with empty strings
        if echo "${PROD_CONFIG}" | grep -q 'ROBOKASSA_MERCHANT_LOGIN: ""'; then
          echo "FAIL: generic base environment overrode ROBOKASSA_MERCHANT_LOGIN with empty string!"
          exit 1
        fi
        echo "EMPTY_SECRET_OVERRIDE=false"

        # Clean up synthetic env file
        rm -f backend/.env
    - name: Verify app-image-independent migration runner
      run: |
        set -eu
        DB_VOLUME="photodoc-candidate-migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        cleanup() {
          docker volume rm "${DB_VOLUME}" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        for app_image in $(docker compose config --images); do
          if docker image inspect "${app_image}" >/dev/null 2>&1; then
            echo "FAIL: PhotoDoc application image exists before migration regression"
            exit 1
          fi
        done
        docker volume create "${DB_VOLUME}" >/dev/null
        docker run --rm --user 0 \
          -v "${DB_VOLUME}:/data" \
          python:3.11-alpine \
          python -c "import sqlite3; c=sqlite3.connect('/data/orders.db'); c.execute('CREATE TABLE orders (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, phone TEXT)'); c.execute(\"INSERT INTO orders (name, phone) VALUES ('synthetic', '+70000000000')\"); c.commit(); c.close()"
        docker run --rm --user 0 \
          -v "${DB_VOLUME}:/data" \
          alpine sh -c 'chown 0:0 /data/orders.db && chmod 0644 /data/orders.db && test "$(stat -c "%u:%g %a" /data/orders.db)" = "0:0 644"'

        DRY_RUN_OUTPUT="$(docker run --rm --user 65534:65534 \
          -v "${DB_VOLUME}:/data:ro" \
          -v "$PWD/backend:/candidate/backend:ro" \
          -w /candidate/backend \
          python:3.11-alpine \
          python migrations/reconcile_payment_schema.py \
            --db /data/orders.db \
            --check \
            --allow-legacy-unmarked)"
        printf '%s\n' "${DRY_RUN_OUTPUT}"
        printf '%s\n' "${DRY_RUN_OUTPUT}" | grep -q '^MIGRATION_REQUIRED=true$'

        docker run --rm --user 0 \
          -v "${DB_VOLUME}:/data" \
          -v "$PWD/backend:/candidate/backend:ro" \
          -w /candidate/backend \
          python:3.11-alpine \
          python migrations/reconcile_payment_schema.py \
            --db /data/orders.db \
            --apply \
            --allow-legacy-unmarked
        docker run --rm --user 0 \
          -v "${DB_VOLUME}:/data" \
          -v "$PWD/backend:/candidate/backend:ro" \
          -w /candidate/backend \
          python:3.11-alpine \
          python migrations/reconcile_delivery_schema.py \
            --db /data/orders.db \
            --apply
        echo "MIGRATION_RUNNER_APP_IMAGE_INDEPENDENT=true"
        echo "ROOT_MIGRATION_ON_ROOT_OWNED_DB=PASS"

        PREFLIGHT_OUTPUT="$(docker run --rm --user 65534:65534 \
          -v "${DB_VOLUME}:/data:ro" \
          -v "$PWD/scripts:/candidate/scripts:ro" \
          -v "$PWD/backend:/candidate/backend:ro" \
          -w /candidate \
          python:3.11-alpine \
          python scripts/production_preflight.py \
            --db /data/orders.db \
            --check-only)"
        printf '%s\n' "${PREFLIGHT_OUTPUT}"
        printf '%s\n' "${PREFLIGHT_OUTPUT}" | grep -q '^DB_APPLICATION_ID=1346650441$'
        printf '%s\n' "${PREFLIGHT_OUTPUT}" | grep -q '^DB_IDENTITY_VALID=true$'
        printf '%s\n' "${PREFLIGHT_OUTPUT}" | grep -q '^READY_FOR_STARTUP=true$'
        echo "STRICT_READINESS_AFTER_MIGRATION=PASS"
    - name: Build Docker images
      run: docker compose build
    - name: Prove production external-volume and DB identity fail-closed contracts
      run: |
        set -eu
        PROJECT="p0-volume-ci-${GITHUB_RUN_ID}"
        MISSING="photodoc-missing-${GITHUB_RUN_ID}"
        WRONG="photodoc-wrong-${GITHUB_RUN_ID}"
        CORRECT="photodoc-correct-${GITHUB_RUN_ID}"
        UPLOADS="$PWD/.ci-uploads"
        mkdir -p "${UPLOADS}"
        cat << 'EOF' > backend/.env
        ROBOKASSA_MERCHANT_LOGIN=ci
        ROBOKASSA_PASSWORD1=ci1
        ROBOKASSA_PASSWORD2=ci2
        ROBOKASSA_IS_TEST=1
        SMTP_SERVER=example.invalid
        SMTP_PORT=465
        SMTP_USER=ci
        SMTP_PASSWORD=ci
        EMAIL_TO=ci@example.invalid
        YANDEX_DISK_TOKEN=ci
        EOF
        cleanup() {
          docker compose -p "${PROJECT}" -f docker-compose.yml -f docker-compose.production.yml down --remove-orphans >/dev/null 2>&1 || true
          docker volume rm "${WRONG}" "${CORRECT}" "${EMPTY_PROD:-}" >/dev/null 2>&1 || true
          rm -f backend/.env
          rm -rf "${UPLOADS}"
        }
        trap cleanup EXIT

        if PHOTODOC_DB_VOLUME="${MISSING}" PHOTODOC_UPLOADS_SOURCE="${UPLOADS}" \
          docker compose -p "${PROJECT}" -f docker-compose.yml -f docker-compose.production.yml create backend; then
          echo "FAIL: missing external production volume was silently created"
          exit 1
        fi
        if docker volume inspect "${MISSING}" >/dev/null 2>&1; then
          echo "FAIL: Docker created the missing external production volume"
          exit 1
        fi
        echo "MISSING_EXTERNAL_VOLUME_FAILS=true"

        EMPTY_PROD="photodoc-empty-${GITHUB_RUN_ID}"
        docker volume create "${EMPTY_PROD}" >/dev/null
        if PHOTODOC_DB_VOLUME="${EMPTY_PROD}" PHOTODOC_UPLOADS_SOURCE="${UPLOADS}" \
          docker compose -p "${PROJECT}" -f docker-compose.yml -f docker-compose.production.yml \
          run --rm --no-deps backend python -c "import main"; then
          echo "FAIL: production backend created a fresh DB on empty volume instead of failing closed"
          exit 1
        fi
        echo "EMPTY_PRODUCTION_VOLUME_FAILS_CLOSED=true"
        docker volume rm "${EMPTY_PROD}" >/dev/null

        docker volume create "${WRONG}" >/dev/null
        docker volume create "${CORRECT}" >/dev/null
        # The failed `create` still builds the project-scoped backend image before
        # Compose checks the missing external volume. No container exists yet, so
        # `docker compose images -q` would be empty; use the deterministic tag.
        BACKEND_IMAGE="${PROJECT}-backend"

        docker run --rm --user root -e DATABASE_PATH=/data/orders.db \
          -v "${WRONG}:/data" "${BACKEND_IMAGE}" \
          python -c "import main, sqlite3; c=sqlite3.connect('/data/orders.db'); c.execute('PRAGMA application_id=123456'); c.commit(); c.close()"
        if PHOTODOC_DB_VOLUME="${WRONG}" PHOTODOC_UPLOADS_SOURCE="${UPLOADS}" \
          docker compose -p "${PROJECT}" -f docker-compose.yml -f docker-compose.production.yml \
          run --rm --no-deps backend python -c "import main"; then
          echo "FAIL: backend accepted the wrong database identity"
          exit 1
        fi
        echo "WRONG_DB_IDENTITY_FAILS=true"

        docker run --rm --user root -e DATABASE_PATH=/data/orders.db \
          -v "${CORRECT}:/data" "${BACKEND_IMAGE}" python -c "import main"
        PHOTODOC_DB_VOLUME="${CORRECT}" PHOTODOC_UPLOADS_SOURCE="${UPLOADS}" \
          docker compose -p "${PROJECT}" -f docker-compose.yml -f docker-compose.production.yml \
          run --rm --no-deps backend python -c "import main; assert main.database_readiness_ok()"
        echo "CORRECT_DB_IDENTITY_PASSES=true"
    - name: Verify production-like root migration and storage permission cutover
      run: |
        set -eu
        DB_VOLUME="photodoc-root-owned-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        UPLOADS="$PWD/.ci-root-owned-uploads"
        export PHOTODOC_DB_VOLUME="${DB_VOLUME}"
        export PHOTODOC_UPLOADS_SOURCE="${UPLOADS}"
        COMPOSE="docker compose -f docker-compose.yml -f docker-compose.production.yml"

        mkdir -p "${UPLOADS}"
        cat << 'EOF' > backend/.env
        ROBOKASSA_MERCHANT_LOGIN=ci
        ROBOKASSA_PASSWORD1=ci_pass1
        ROBOKASSA_PASSWORD2=ci_pass2
        ROBOKASSA_IS_TEST=1
        SMTP_SERVER=example.invalid
        SMTP_PORT=465
        SMTP_USER=ci@example.invalid
        SMTP_PASSWORD=ci_password
        EMAIL_TO=ci@example.invalid
        YANDEX_DISK_TOKEN=ci_token
        EOF
        cleanup() {
          ${COMPOSE} down --remove-orphans >/dev/null 2>&1 || true
          docker volume rm "${DB_VOLUME}" >/dev/null 2>&1 || true
          rm -f backend/.env
          rm -rf "${UPLOADS}"
        }
        trap cleanup EXIT

        docker volume create "${DB_VOLUME}" >/dev/null
        ${COMPOSE} run --rm --no-deps --user root backend python -c \
          "import sqlite3; c=sqlite3.connect('/data/orders.db'); c.execute('CREATE TABLE orders (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, phone TEXT)'); c.execute(\"INSERT INTO orders (name, phone) VALUES ('synthetic', '+70000000000')\"); c.commit(); c.close()"
        docker run --rm --user root -v "${DB_VOLUME}:/data" -v "${UPLOADS}:/uploads" alpine sh -c '
          chown 0:0 /data /data/orders.db /uploads &&
          chmod 0755 /data /uploads &&
          chmod 0644 /data/orders.db &&
          test "$(stat -c "%u:%g %a" /data/orders.db)" = "0:0 644" &&
          test "$(stat -c "%u:%g %a" /uploads)" = "0:0 755"
        '
        echo "CURRENT_DB_OWNER=root"
        echo "BACKEND_UID=1000"

        if ${COMPOSE} run --rm --no-deps backend test -w /data/orders.db; then
          echo "FAIL: appuser could write the root-owned database before preparation"
          exit 1
        fi
        echo "APPUSER_DB_WRITE_BEFORE=false"
        if ${COMPOSE} run --rm --no-deps backend test -w /app/uploads; then
          echo "FAIL: appuser could write the root-owned uploads directory before preparation"
          exit 1
        fi
        echo "APPUSER_UPLOAD_WRITE_BEFORE=false"

        docker run --rm --user 0 \
          -v "${DB_VOLUME}:/data" \
          -v "$PWD/backend:/candidate/backend:ro" \
          -w /candidate/backend \
          python:3.11-alpine \
          python migrations/reconcile_payment_schema.py \
            --db /data/orders.db \
            --apply \
            --allow-legacy-unmarked
        docker run --rm --user 0 \
          -v "${DB_VOLUME}:/data" \
          -v "$PWD/backend:/candidate/backend:ro" \
          -w /candidate/backend \
          python:3.11-alpine \
          python migrations/reconcile_delivery_schema.py \
            --db /data/orders.db \
            --apply
        echo "MIGRATION_RUNNER_APP_IMAGE_INDEPENDENT=true"
        echo "PRODUCTION_MIGRATION_CAN_WRITE_ROOT_OWNED_DB=true"
        echo "ROOT_MIGRATION_ON_ROOT_OWNED_DB=PASS"

        docker run --rm --user 65534:65534 \
          -v "${DB_VOLUME}:/data:ro" \
          -v "$PWD/scripts:/candidate/scripts:ro" \
          -v "$PWD/backend:/candidate/backend:ro" \
          -w /candidate \
          python:3.11-alpine \
          python scripts/production_preflight.py \
            --db /data/orders.db \
            --check-only
        echo "STRICT_READINESS_AFTER_MIGRATION=PASS"

        ${COMPOSE} run --rm --no-deps --user root backend sh -c '
          chown -R 1000:1000 /data /app/uploads &&
          test -w /data/orders.db &&
          test -w /app/uploads
        '

        ${COMPOSE} run --rm --no-deps backend python -c \
          "import sqlite3; c=sqlite3.connect('/data/orders.db'); c.execute('BEGIN IMMEDIATE'); c.rollback(); c.close()"
        echo "APPUSER_DB_WRITE_AFTER=true"
        echo "DB_APPUSER_WRITABLE=true"
        ${COMPOSE} run --rm --no-deps backend sh -c '
          test -w /app/uploads &&
          touch /app/uploads/.appuser-write-test &&
          rm /app/uploads/.appuser-write-test
        '
        echo "APPUSER_UPLOAD_WRITE_AFTER=true"
        echo "UPLOADS_APPUSER_WRITABLE=true"

        ${COMPOSE} run --rm --no-deps backend \
          python -c "import main; assert main.database_readiness_ok()"
        echo "STRICT_READINESS_AFTER_PREP=PASS"

        ${COMPOSE} up -d --no-deps --wait --wait-timeout 120 backend
        ${COMPOSE} exec -T backend curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null
        echo "BACKEND_SYNTHETIC_STORAGE_START=PASS"

        docker run --rm -v "${DB_VOLUME}:/data" --user root alpine sh -c '
          test -r /data/orders.db &&
          test -w /data/orders.db &&
          touch /data/.root-write-test &&
          rm /data/.root-write-test
        '
        echo "OLD_ROOT_BACKEND_CAN_ACCESS_UID1000_DB=true"
    - name: Start containers
      run: |
        docker compose up -d --wait --wait-timeout 180
        docker compose ps
    - name: Verify named volume writability and DB creation
      run: |
        echo "Verifying backend permissions on /data and /app/uploads..."
        docker compose exec -T backend sh -c '
          test -w /data &&
          test -w /app/uploads &&
          touch /data/.write-test &&
          touch /app/uploads/.write-test &&
          rm /data/.write-test /app/uploads/.write-test
        '
        echo "Verifying application database file exists in volume..."
        docker compose exec -T backend test -f /data/orders.db
        echo "Volumes are writable and orders.db exists."
    - name: Run container smoke tests
      run: |
        echo "Testing Root SPA..."
        curl --fail -s -o /dev/null -w "Root status: %{http_code}\n" "http://127.0.0.1:${PORT}/"
        curl --fail "http://127.0.0.1:${PORT}/" > /dev/null

        echo "Testing OG Image..."
        curl --fail -s -o /dev/null -w "OG image status: %{http_code}\n" "http://127.0.0.1:${PORT}/og/photodoc-og.jpg"
        curl --fail "http://127.0.0.1:${PORT}/og/photodoc-og.jpg" > /dev/null

        echo "Testing API Proxy /api/health..."
        HEALTH_RESP=$(curl --fail -sS "http://127.0.0.1:${PORT}/api/health")
        echo "API Health Response: ${HEALTH_RESP}"
        echo "${HEALTH_RESP}" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'

        echo "Testing containerized Nginx upload limits and contracts..."
        python scripts/test_container_upload_limits.py --url "http://127.0.0.1:${PORT}"
    - name: Verify isolated staging Docker Compose cold-start and restart
      run: |
        set -eu
        STAGING_PROJECT="staging-ci-${GITHUB_RUN_ID}"
        STAGING_PORT="8081"
        cleanup_staging() {
          docker compose -p "${STAGING_PROJECT}" -f docker-compose.staging.yml logs --no-color 2>/dev/null || true
          docker compose -p "${STAGING_PROJECT}" -f docker-compose.staging.yml down -v --remove-orphans >/dev/null 2>&1 || true
        }
        trap cleanup_staging EXIT

        echo "1. Performing staging cold-start on fresh empty volume..."
        STAGING_PORT="${STAGING_PORT}" docker compose -p "${STAGING_PROJECT}" -f docker-compose.staging.yml up -d --wait --wait-timeout 180

        echo "2. Verifying staging /api/health returns HTTP 200 and status ok..."
        STAGING_HEALTH=$(curl --fail -sS "http://127.0.0.1:${STAGING_PORT}/api/health")
        echo "Staging Health: ${STAGING_HEALTH}"
        echo "${STAGING_HEALTH}" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'

        echo "3. Inserting synthetic staging record..."
        docker compose -p "${STAGING_PROJECT}" -f docker-compose.staging.yml exec -T backend python -c \
          "import sqlite3; conn = sqlite3.connect('/data/orders.db'); conn.execute(\"INSERT INTO orders (name, phone, format, status) VALUES ('Staging Persistence Test', '+79998887766', '10x15', 'new')\"); conn.commit(); conn.close()"

        echo "4. Restarting staging backend container..."
        docker compose -p "${STAGING_PROJECT}" -f docker-compose.staging.yml restart backend
        sleep 5
        docker compose -p "${STAGING_PROJECT}" -f docker-compose.staging.yml exec -T backend curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null

        echo "5. Verifying test data survived restart..."
        docker compose -p "${STAGING_PROJECT}" -f docker-compose.staging.yml exec -T backend python -c \
          "import sqlite3; conn = sqlite3.connect('/data/orders.db'); row = conn.execute(\"SELECT name FROM orders WHERE phone = '+79998887766'\").fetchone(); assert row and row[0] == 'Staging Persistence Test'; conn.close()"

        echo "6. Verifying staging /api/health still passes after restart..."
        STAGING_HEALTH_AFTER=$(curl --fail -sS "http://127.0.0.1:${STAGING_PORT}/api/health")
        echo "Staging Health After Restart: ${STAGING_HEALTH_AFTER}"
        echo "${STAGING_HEALTH_AFTER}" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'

        echo "STAGING_COLD_START_AND_RESTART=PASS"

        echo "7. Verifying staging delivery override configuration..."
        # Missing staging token must fail closed
        if docker compose -f docker-compose.staging.yml -f docker-compose.staging.delivery.yml config >/dev/null 2>&1; then
          echo "FAIL: Staging delivery override succeeded without required YANDEX_DISK_STAGING_TOKEN!"
          exit 1
        fi
        echo "STAGING_OVERRIDE_REQUIRES_EXPLICIT_TOKEN=true"
        # Providing explicit staging token validates compose config
        YANDEX_DISK_STAGING_TOKEN=y0_ci_test_token docker compose -f docker-compose.staging.yml -f docker-compose.staging.delivery.yml config >/dev/null
        echo "STAGING_OVERRIDE_COMPOSE_VALID=true"

        cleanup_staging
        trap - EXIT
    - name: Verify prebuilt staging Docker Compose configurations and cold-start
      run: |
        set -eu
        echo "1. Verifying prebuilt compose files contain zero build sections..."
        if grep -E '^[[:space:]]*build[[:space:]]*:' docker-compose.staging.prebuilt.yml docker-compose.staging.prebuilt.delivery.yml; then
          echo "FAIL: Found forbidden 'build:' section in prebuilt compose files!"
          exit 1
        fi
        echo "ZERO_BUILD_SECTIONS_VERIFIED=true"

        echo "2. Verifying prebuilt staging compose fails closed when images are missing..."
        if docker compose -f docker-compose.staging.prebuilt.yml config >/dev/null 2>&1; then
          echo "FAIL: prebuilt staging compose succeeded without required images!"
          exit 1
        fi
        echo "PREBUILT_MISSING_IMAGES_FAILS_CLOSED=true"

        echo "3. Verifying prebuilt staging compose succeeds when image variables are supplied..."
        PHOTODOC_BACKEND_IMAGE="ghcr.io/life2boat/photodoc-backend:cand" \
        PHOTODOC_FRONTEND_IMAGE="ghcr.io/life2boat/photodoc-frontend:cand" \
        docker compose -f docker-compose.staging.prebuilt.yml config >/dev/null
        echo "PREBUILT_COMPOSE_VALID=true"

        echo "4. Verifying prebuilt delivery override requires token..."
        if PHOTODOC_BACKEND_IMAGE="ghcr.io/life2boat/photodoc-backend:cand" \
           PHOTODOC_FRONTEND_IMAGE="ghcr.io/life2boat/photodoc-frontend:cand" \
           docker compose -f docker-compose.staging.prebuilt.yml -f docker-compose.staging.prebuilt.delivery.yml config >/dev/null 2>&1; then
          echo "FAIL: prebuilt delivery override succeeded without required YANDEX_DISK_STAGING_TOKEN!"
          exit 1
        fi
        echo "PREBUILT_OVERRIDE_REQUIRES_TOKEN=true"

        PHOTODOC_BACKEND_IMAGE="ghcr.io/life2boat/photodoc-backend:cand" \
        PHOTODOC_FRONTEND_IMAGE="ghcr.io/life2boat/photodoc-frontend:cand" \
        YANDEX_DISK_STAGING_TOKEN="y0_ci_test" \
        docker compose -f docker-compose.staging.prebuilt.yml -f docker-compose.staging.prebuilt.delivery.yml config >/dev/null
        echo "PREBUILT_OVERRIDE_CONFIG_VALID=true"

        echo "5. Verifying prebuilt staging container cold-start without --build..."
        PREBUILT_PROJECT="staging-prebuilt-ci-${GITHUB_RUN_ID}"
        PREBUILT_PORT="8082"
        cleanup_prebuilt() {
          docker compose -p "${PREBUILT_PROJECT}" -f docker-compose.staging.prebuilt.yml logs --no-color 2>/dev/null || true
          docker compose -p "${PREBUILT_PROJECT}" -f docker-compose.staging.prebuilt.yml down -v --remove-orphans >/dev/null 2>&1 || true
        }
        trap cleanup_prebuilt EXIT

        # Find locally built images from previous compose build step
        BACKEND_IMG=$(docker compose images -q backend | head -n1)
        FRONTEND_IMG=$(docker compose images -q frontend | head -n1)
        docker tag "${BACKEND_IMG}" "photodoc-backend-candidate:${GITHUB_SHA}"
        docker tag "${FRONTEND_IMG}" "photodoc-frontend-candidate:${GITHUB_SHA}"

        PHOTODOC_BACKEND_IMAGE="photodoc-backend-candidate:${GITHUB_SHA}" \
        PHOTODOC_FRONTEND_IMAGE="photodoc-frontend-candidate:${GITHUB_SHA}" \
        STAGING_PORT="${PREBUILT_PORT}" \
        docker compose -p "${PREBUILT_PROJECT}" -f docker-compose.staging.prebuilt.yml up -d --no-build --wait --wait-timeout 180

        PREBUILT_HEALTH=$(curl --fail -sS "http://127.0.0.1:${PREBUILT_PORT}/api/health")
        echo "Prebuilt Staging Health: ${PREBUILT_HEALTH}"
        echo "${PREBUILT_HEALTH}" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'
        echo "PREBUILT_COLD_START_PASSES=true"

        cleanup_prebuilt
        trap - EXIT
    - name: Verify safe staging deployment preflight and gatekeeper
      run: |
        set -eu
        echo "1. Testing preflight rejection of production IP 79.137.196.14..."
        if python scripts/staging_deploy_preflight.py --target-host 79.137.196.14; then
          echo "FAIL: Staging preflight accepted protected production IP!"
          exit 1
        fi
        echo "PRODUCTION_IP_REJECTION=PASS"

        echo "2. Testing preflight fail-closed on missing images..."
        if python scripts/staging_deploy_preflight.py; then
          echo "FAIL: Staging preflight succeeded without required images!"
          exit 1
        fi
        echo "MISSING_IMAGES_FAIL_CLOSED=PASS"

        echo "3. Testing preflight fail-closed on mutable :latest tag..."
        if python scripts/staging_deploy_preflight.py \
             --backend-image "ghcr.io/life2boat/photodoc-backend:latest" \
             --frontend-image "ghcr.io/life2boat/photodoc-frontend:latest"; then
          echo "FAIL: Staging preflight accepted mutable latest tag!"
          exit 1
        fi
        echo "MUTABLE_TAG_REJECTION=PASS"

        echo "4. Testing preflight success with valid digest-pinned images..."
        SYNTH_B_DIGEST="sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        SYNTH_F_DIGEST="sha256:fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"
        python scripts/staging_deploy_preflight.py \
          --target-host 127.0.0.1 \
          --backend-image "ghcr.io/life2boat/photodoc-backend@${SYNTH_B_DIGEST}" \
          --frontend-image "ghcr.io/life2boat/photodoc-frontend@${SYNTH_F_DIGEST}" \
          --json > /tmp/preflight_report.json
        grep -q '"pass": true' /tmp/preflight_report.json
        echo "DIGEST_PINNED_PREFLIGHT=PASS"

        echo "5. Testing deploy script bash syntax and dry-run..."
        bash -n scripts/deploy_staging_prebuilt.sh
        PHOTODOC_BACKEND_IMAGE="ghcr.io/life2boat/photodoc-backend@${SYNTH_B_DIGEST}" \
        PHOTODOC_FRONTEND_IMAGE="ghcr.io/life2boat/photodoc-frontend@${SYNTH_F_DIGEST}" \
        PHOTODOC_TARGET_HOST="127.0.0.1" \
        ./scripts/deploy_staging_prebuilt.sh --dry-run
        echo "DEPLOY_SCRIPT_DRY_RUN=PASS"
    - name: Dump logs on failure
      if: failure()
      run: |
        docker compose ps
        docker compose logs --no-color
    - name: Teardown containers
      if: always()
      run: docker compose down -v

  publish-images:
    name: Build & Publish GHCR Images
    runs-on: ubuntu-latest
    needs: [docker-build, payment-security-tests, playwright-tests]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/infra/r4-prebuilt-staging-images' || github.ref == 'refs/heads/infra/r4-safe-staging-bootstrap') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build metadata and tags
        id: meta
        run: |
          set -eu
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "backend_full=ghcr.io/${OWNER_LOWER}/photodoc-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_short=ghcr.io/${OWNER_LOWER}/photodoc-backend:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_full=ghcr.io/${OWNER_LOWER}/photodoc-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_short=ghcr.io/${OWNER_LOWER}/photodoc-frontend:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Backend image
        id: build_backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_full }}
            ${{ steps.meta.outputs.backend_short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push Frontend image
        id: build_frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
            VITE_YANDEX_METRIKA_ID=
            VITE_SUPABASE_URL=
            VITE_SUPABASE_ANON_KEY=
          tags: |
            ${{ steps.meta.outputs.frontend_full }}
            ${{ steps.meta.outputs.frontend_short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Generate release manifest
        id: manifest
        run: |
          set -eu
          BACKEND_DIGEST="${{ steps.build_backend.outputs.digest }}"
          FRONTEND_DIGEST="${{ steps.build_frontend.outputs.digest }}"

          cat << EOF > release-manifest.json
          {
            "repository": "${{ github.repository }}",
            "commit_sha": "${{ github.sha }}",
            "short_sha": "${{ steps.meta.outputs.short_sha }}",
            "created_at": "${{ steps.meta.outputs.build_time }}",
            "images": {
              "backend": {
                "image": "${{ steps.meta.outputs.backend_full }}",
                "short_tag": "${{ steps.meta.outputs.backend_short }}",
                "digest": "${BACKEND_DIGEST}"
              },
              "frontend": {
                "image": "${{ steps.meta.outputs.frontend_full }}",
                "short_tag": "${{ steps.meta.outputs.frontend_short }}",
                "digest": "${FRONTEND_DIGEST}"
              }
            }
          }
          EOF

          echo "Release manifest generated:"
          cat release-manifest.json

          echo "### PhotoDoc AI Prebuilt Images Published to GHCR" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Component | Tag | Immutable Digest |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Backend** | \`${{ steps.meta.outputs.backend_full }}\` | \`${BACKEND_DIGEST}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Frontend** | \`${{ steps.meta.outputs.frontend_full }}\` | \`${FRONTEND_DIGEST}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Staging Deployment via Digest (Pinned & Immutable):**" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "PHOTODOC_BACKEND_IMAGE="ghcr.io/${{ github.repository_owner }}/photodoc-backend@${BACKEND_DIGEST}" \\" >> "$GITHUB_STEP_SUMMARY"
          echo "PHOTODOC_FRONTEND_IMAGE="ghcr.io/${{ github.repository_owner }}/photodoc-frontend@${FRONTEND_DIGEST}" \\" >> "$GITHUB_STEP_SUMMARY"
          echo "docker compose -p photodoc-staging -f docker-compose.staging.prebuilt.yml up -d --no-build" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          retention-days: 90
