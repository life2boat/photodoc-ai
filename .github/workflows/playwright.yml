name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  playwright-tests:
    name: Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: example-anon-key
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Run lint
      run: npm run lint
    - name: Run build
      run: npm run build
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30

  payment-security-tests:
    name: Payment Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ROBOKASSA_MERCHANT_LOGIN: ci_merchant
      ROBOKASSA_PASSWORD1: ci_pass1
      ROBOKASSA_PASSWORD2: ci_pass2
      ROBOKASSA_IS_TEST: "1"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install backend dependencies
      run: pip install -r requirements.txt
    - name: Install pytest
      run: pip install pytest
    - name: Run payment security tests
      run: pytest tests/test_payment_security.py -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: example-anon-key
      VITE_YANDEX_METRIKA_ID: ""
      VITE_API_URL: /api
      PORT: 80
      ROBOKASSA_IS_TEST: "1"
      DATABASE_PATH: /data/orders.db
    steps:
    - uses: actions/checkout@v4
    - name: Validate Docker Compose config
      run: docker compose config
    - name: Build Docker images
      run: docker compose build
    - name: Start containers
      run: |
        docker compose up -d --wait --wait-timeout 180
        docker compose ps
    - name: Run container smoke tests
      run: |
        echo "Testing Root SPA..."
        curl --fail -s -o /dev/null -w "Root status: %{http_code}\n" "http://127.0.0.1:${PORT}/"
        curl --fail "http://127.0.0.1:${PORT}/" > /dev/null

        echo "Testing OG Image..."
        curl --fail -s -o /dev/null -w "OG image status: %{http_code}\n" "http://127.0.0.1:${PORT}/og/photodoc-og.jpg"
        curl --fail "http://127.0.0.1:${PORT}/og/photodoc-og.jpg" > /dev/null

        echo "Testing API Proxy /api/health..."
        HEALTH_RESP=$(curl --fail -sS "http://127.0.0.1:${PORT}/api/health")
        echo "API Health Response: ${HEALTH_RESP}"
        echo "${HEALTH_RESP}" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'
    - name: Dump logs on failure
      if: failure()
      run: |
        docker compose ps
        docker compose logs --no-color
    - name: Teardown containers
      if: always()
      run: docker compose down -v
