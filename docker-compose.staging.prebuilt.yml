# PhotoDoc AI - Staging Docker Compose Configuration (Prebuilt Images)
# Project: photodoc-staging
# Isolated volumes, test secrets, disabled external workers, no access to production assets.
# Pulls prebuilt images from GitHub Container Registry (GHCR) without local compilation.
#
# Usage:
#   PHOTODOC_BACKEND_IMAGE="ghcr.io/life2boat/photodoc-backend:<sha>" \
#   PHOTODOC_FRONTEND_IMAGE="ghcr.io/life2boat/photodoc-frontend:<sha>" \
#   docker compose -p photodoc-staging -f docker-compose.staging.prebuilt.yml up -d --no-build
#
# Deployment Verification:
#   curl http://127.0.0.1:${STAGING_PORT:-8081}/api/health

services:
  backend:
    image: "${PHOTODOC_BACKEND_IMAGE:?Error: PHOTODOC_BACKEND_IMAGE is required (e.g. ghcr.io/life2boat/photodoc-backend:<sha>)}"
    container_name: photodoc-staging-backend
    restart: unless-stopped
    env_file:
      - ${PHOTODOC_STAGING_ENV_FILE:-./backend/.env.staging.example}
    environment:
      DATABASE_PATH: /data/orders.db
      PHOTODOC_REQUIRE_DB_IDENTITY: "1"
      PHOTODOC_ALLOW_FRESH_DB: "1"
      PHOTODOC_STAGING: "1"
      DELIVERY_WORKER_ENABLED: "0"
      ROBOKASSA_IS_TEST: "1"
      ROBOKASSA_MERCHANT_LOGIN: ${ROBOKASSA_MERCHANT_LOGIN:-staging_merchant}
      ROBOKASSA_PASSWORD1: ${ROBOKASSA_PASSWORD1:-staging_pass1}
      ROBOKASSA_PASSWORD2: ${ROBOKASSA_PASSWORD2:-staging_pass2}
      YANDEX_DISK_ROOT_DIR: "PhotoDoc_Staging"
      SMTP_SERVER: ${SMTP_SERVER:-127.0.0.1}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER:-staging@photodoc-ai.ru}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-staging_secret}
      EMAIL_TO: ${EMAIL_TO:-staging_owner@photodoc-ai.ru}
    volumes:
      - photodoc_staging_db:/data
      - photodoc_staging_uploads:/app/uploads
    networks:
      - photodoc_staging_network

  frontend:
    image: "${PHOTODOC_FRONTEND_IMAGE:?Error: PHOTODOC_FRONTEND_IMAGE is required (e.g. ghcr.io/life2boat/photodoc-frontend:<sha>)}"
    container_name: photodoc-staging-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STAGING_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - photodoc_staging_network

volumes:
  photodoc_staging_db:
    name: photodoc_staging_backend-data
  photodoc_staging_uploads:
    name: photodoc_staging_uploads

networks:
  photodoc_staging_network:
    name: photodoc_staging_network
